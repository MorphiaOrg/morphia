name: Pull Requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  CodeAudits:
    uses: evanchooly/workflows/.github/workflows/code-audits.yml@master
    with:
      java: 17
  # build.yml directly rather than the shared pull-request.yml: that one's nested auto-merge job can only wait on its own
  # build, so the auto-merge job lives here where it can wait on every job in this workflow
  Build:
    uses: evanchooly/workflows/.github/workflows/build.yml@master
    with:
      java: 17
      os: ubuntu-latest
      maven-flags: "-e -Dmorphia.mapper=critter"

  # The Build job above runs a plain `install`, so critter has no pre-generated models and generates every model at
  # runtime. This job covers the AOT path the way build.yml does: build, let critter-maven generate the test models,
  # then run the tests without recompiling (test-compile would replace the woven classes). Pushes to this repo also run
  # build.yml, but pull requests from forks only get this workflow.
  CritterAot:
    name: Critter (AOT)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build without tests
        run: ./mvnw -e -U install -DskipTests

      - name: Generate critter test models
        working-directory: core
        run: ../mvnw -e dev.morphia.morphia:critter-maven:generate-test-models

      - name: Test against the generated models
        run: ./mvnw -e surefire:test -Dmorphia.mapper=critter

      - name: Collect logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: "logs-critter-aot-${{ github.run_id }}"
          path: |
            **/target/**/*.log
            **/target/**/*.err
          retention-days: 7

  dependabot:
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' }}
    name: Automerge dependabot PRs
    needs:
      - CodeAudits
      - Build
      - CritterAot
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: "dependabot-automerge-${{ github.base_ref }}"
      cancel-in-progress: false
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # a token other than GITHUB_TOKEN so the eventual merge triggers build.yml on master
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
