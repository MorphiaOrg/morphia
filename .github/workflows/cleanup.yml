name: Clean Up

on:
  workflow_dispatch:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 0 * * *'

jobs:
  CleanUp:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: yanovian/prune-old-actions@v1 # v1.0.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: 30
          keep-latest: 10
      - name: Remove prior Clean Up runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow "Clean Up" --json databaseId --limit 100 \
            --jq '.[1:][].databaseId' |
          while read -r run_id; do
            gh run delete "$run_id"
          done