name: Operator Audit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'audits/**'
      - 'pom.xml'
      - '.github/workflows/audits.yml'
      # The shared comparison vectors, which core's comparators also run.
      - 'core/src/test/resources/dev/morphia/test/vectors/**'
      - 'core/src/test/java/dev/morphia/test/StrictBson.java'
      - 'core/src/test/java/dev/morphia/test/PrintedResults.java'

permissions:
  contents: read

jobs:
  OfflineTests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run offline operator audit tests
        run: ./mvnw -B -ntp -Daudits -pl audits verify

      - name: Collect test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operator-audit-tests
          path: audits/target/surefire-reports
          retention-days: 7

  ParserTests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java for coordinator integration
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Setup isolated parser Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.16'

      - name: Install pinned runtime manager
        run: python -m pip install uv==0.13.7

      - name: Install frozen parser dependencies
        run: uv sync --frozen --project audits/parser --no-python-downloads

      - name: Run offline structured parser regressions
        run: audits/parser/.venv/bin/python -I -B audits/parser/tests/test_adapter.py

      - name: Run offline probe contract regressions
        run: python -B -m unittest discover -s audits/probes/shell-results -p 'test_*.py'

      - name: Verify coordinator integration
        run: ./mvnw -B -ntp -Daudits -pl audits test -Dtest=DocumentParsingTest -Daudits.parser.python="$PWD/audits/parser/.venv/bin/python" -Daudits.parser.adapter="$PWD/audits/parser/adapter.py"
