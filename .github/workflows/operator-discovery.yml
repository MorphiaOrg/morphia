name: Operator Example Discovery

# Inventories the documented operator examples at the head of mongodb/docs, generates a candidate
# with its gaps, and integrates it under both mappers, uploading every report. It never commits or
# promotes. The Publish job then files its findings as issues in this repository: each binding the
# generated cases lack, each example that appeared upstream with no test, and a failing integration.
# An issue's marker keeps reruns from filing it twice; a closed issue is not reopened.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: File the findings as issues (otherwise only report what would be filed)
        type: boolean
        default: true
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

# Overlapping runs would publish from two journals at once.
concurrency:
  group: operator-discovery
  cancel-in-progress: false

jobs:
  Discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # A sparse, blobless clone: git checks every blob, and it makes no rate-limited API calls.
      - name: Checkout mongodb/docs operator pages
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/mongodb/docs.git "$RUNNER_TEMP/docs"
          git -C "$RUNNER_TEMP/docs" sparse-checkout set --no-cone \
            /content/manual/manual/source/reference/operator/ /content/manual/manual/source/includes/
          git -C "$RUNNER_TEMP/docs" checkout -q

      - name: Discover, generate and integrate
        run: audits/discover.sh "$RUNNER_TEMP/docs" "$RUNNER_TEMP/discovery" --integrate

      - name: Summarize
        if: always()
        run: '[ ! -f "$RUNNER_TEMP/discovery/summary.md" ] || cat "$RUNNER_TEMP/discovery/summary.md" >> "$GITHUB_STEP_SUMMARY"'

      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operator-discovery
          path: |
            ${{ runner.temp }}/discovery/*.json
            ${{ runner.temp }}/discovery/*.md
            ${{ runner.temp }}/discovery/*.diff
            ${{ runner.temp }}/discovery/candidate/
          retention-days: 90

  Publish:
    needs: Discover
    # Discovery's reports are uploaded even when its integration fails, and that failure is a finding.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Download reports
        uses: actions/download-artifact@v7
        with:
          name: operator-discovery
          path: ${{ runner.temp }}/discovery

      # The journal names each finding's issue, which is read by number. The issue listing can lag
      # a recent write by minutes, so without it a rerun soon after a run could file a finding twice.
      - name: Restore the previous journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow operator-discovery.yml -L 20 \
              --json databaseId --jq ".[].databaseId | select(. != $GITHUB_RUN_ID)"); do
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n operator-publications -D "$RUNNER_TEMP/previous" 2>/dev/null \
                && [ -f "$RUNNER_TEMP/previous/journal.json" ]; then
              cp "$RUNNER_TEMP/previous/journal.json" "$RUNNER_TEMP/journal.json"
              echo "Journal from run $run"
              break
            fi
            rm -rf "$RUNNER_TEMP/previous"
          done

      - name: File findings
        env:
          AUDITS_GITHUB_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          flag=$([ "$PUBLISH" = "true" ] && echo --publish || true)
          ./mvnw -B -ntp -q -Daudits -pl audits compile exec:java \
            -Daudits.mainClass=dev.morphia.audits.publish.PublishMainKt \
            -Dexec.args="discovery $RUNNER_TEMP/discovery $PWD/audits/catalog/documented-examples.json $PWD/audits/catalog/publication-policy.json $RUNNER_TEMP/journal.json ${{ github.repository }} $flag" \
            | tee "$RUNNER_TEMP/publications.json"

      - name: Upload publications
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operator-publications
          path: |
            ${{ runner.temp }}/publications.json
            ${{ runner.temp }}/journal.json
          if-no-files-found: ignore
          retention-days: 90
